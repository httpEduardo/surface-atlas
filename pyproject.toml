[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attack-surface-prioritizer"
version = "1.0.0"
description = "Prioritize attack-surface assets by exposure risk."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Eduardo" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]

[project.scripts]
attack-surface-prioritizer = "attack_surface_prioritizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
